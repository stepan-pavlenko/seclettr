name: Dev Bundle

on:
  workflow_run:
    workflows:
      - Dev CI
    types:
      - completed
    branches:
      - dev/main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "dev/main"

permissions:
  contents: write
  packages: write

concurrency:
  group: dev-bundle-dev-main
  cancel-in-progress: true

jobs:
  build-dev-bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout target ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Print toolchain
        run: |
          node --version
          npm --version
          pnpm --version
          java -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @seclettr/crypto build
          pnpm --filter @seclettr/protocol build

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          IMAGE_TAG="dev-${SHORT_SHA}"
          BUNDLE_PREFIX="seclettr-dev-main"
          GHCR_REGISTRY="ghcr.io"
          GHCR_NAMESPACE="${{ github.repository }}"
          APP_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BUILD_TIMESTAMP="${{ github.event.workflow_run.created_at }}"
          else
            BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "bundle_prefix=${BUNDLE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "ghcr_registry=${GHCR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_namespace=${GHCR_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "api_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/api" >> "$GITHUB_OUTPUT"
          echo "web_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/web" >> "$GITHUB_OUTPUT"
          echo "sfu_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/sfu" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

          git log -1 --format='%s' HEAD > /tmp/commit-subject.txt
          git log -1 --format='%b' HEAD > /tmp/commit-body.txt

          {
            echo 'commit_subject<<__EOF__'
            cat /tmp/commit-subject.txt
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          load: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          load: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SFU image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/sfu/Dockerfile
          push: true
          load: true
          tags: |
            ${{ steps.meta.outputs.sfu_image }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dev bundle
        shell: bash
        run: |
          COMMON_ARGS=(
            --name      "${{ steps.meta.outputs.bundle_prefix }}"
            --tag       "${{ steps.meta.outputs.image_tag }}"
            --api-image "${{ steps.meta.outputs.api_image }}"
            --web-image "${{ steps.meta.outputs.web_image }}"
            --sfu-image "${{ steps.meta.outputs.sfu_image }}"
            --skip-build
          )
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            pnpm release:build -- "${COMMON_ARGS[@]}" --skip-verify
          else
            pnpm release:build -- "${COMMON_ARGS[@]}"
          fi

      - name: Rebuild workspace packages before Android
        run: |
          pnpm --filter @seclettr/crypto build
          pnpm --filter @seclettr/protocol build

      - name: Build Android debug APK
        shell: bash
        run: pnpm --filter @seclettr/web run android:build:debug

      - name: Upload artifact — Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seclettr-dev-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Smoke-test bundle install
        shell: bash
        run: |
          BUNDLE=$(ls artifacts/*.tar.gz | grep -v '.sha256' | head -1)
          TMPDIR=$(mktemp -d)
          tar -xzf "$BUNDLE" -C "$TMPDIR" --strip-components=1
          cd "$TMPDIR"

          # Minimal env — only vars the installer cannot auto-generate
          cp .env.example .env
          {
            echo "CORS_ORIGIN=http://localhost"
            echo "TURN_DOMAIN=localhost"
            echo "TURN_EXTERNAL_IP=127.0.0.1"
            echo "ANNOUNCED_IP=127.0.0.1"
          } >> .env

          # Install in non-interactive HTTP mode; images are already local
          ./install.sh --non-interactive --mode full --network http --skip-load

          # Wait for API health (up to 60 s)
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:3001/health | grep -q '"status":"ok"'; then
              echo "API healthy after $((i*2))s"
              break
            fi
            if [[ "$i" -eq 30 ]]; then
              docker compose -p seclettr logs --tail 40 api || true
              echo "ERR: API did not become healthy" && exit 1
            fi
          done

          # Cleanup
          docker compose -p seclettr --env-file .env -f docker-compose.yml down -v --remove-orphans || true

      - name: Upload artifact — dev bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.bundle_prefix }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Send deployment dispatch
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          echo "Dev bundle ready: ${{ steps.meta.outputs.bundle_prefix }}-${{ steps.meta.outputs.image_tag }}.tar.gz"
          echo "GHCR images:"
          echo "  ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.image_tag }}"
          echo "  ghcr.io/${{ github.repository }}/web:${{ steps.meta.outputs.image_tag }}"
          echo "  ghcr.io/${{ github.repository }}/sfu:${{ steps.meta.outputs.image_tag }}"
