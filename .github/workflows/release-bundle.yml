name: Release Bundle

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-bundle-main
  cancel-in-progress: false

jobs:
  build-release-bundle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout target ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Print toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @seclettr/crypto build
          pnpm --filter @seclettr/protocol build

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          IMAGE_TAG="main-${SHORT_SHA}"
          BUNDLE_PREFIX="seclettr-release-main"
          GHCR_REGISTRY="ghcr.io"
          GHCR_NAMESPACE="${{ github.repository }}"
          APP_VERSION="$(node -e "console.log(require('./package.json').version)")"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BUILD_TIMESTAMP="${{ github.event.workflow_run.created_at }}"
          else
            BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "bundle_prefix=${BUNDLE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "ghcr_registry=${GHCR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "ghcr_namespace=${GHCR_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "api_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/api" >> "$GITHUB_OUTPUT"
          echo "web_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/web" >> "$GITHUB_OUTPUT"
          echo "sfu_image=${GHCR_REGISTRY}/${GHCR_NAMESPACE}/sfu" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> "$GITHUB_OUTPUT"

          git log -1 --format='%s' HEAD > /tmp/commit-subject.txt
          git log -1 --format='%b' HEAD > /tmp/commit-body.txt

          {
            echo 'commit_subject<<__EOF__'
            cat /tmp/commit-subject.txt
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.api_image }}:latest
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SFU image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./apps/sfu/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sfu_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.sfu_image }}:latest
          build-args: |
            SECLETTR_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_REVISION=${{ steps.meta.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.build_timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release bundle
        shell: bash
        run: |
          COMMON_ARGS=(
            --name      "${{ steps.meta.outputs.bundle_prefix }}"
            --tag       "${{ steps.meta.outputs.image_tag }}"
            --api-image "${{ steps.meta.outputs.api_image }}"
            --web-image "${{ steps.meta.outputs.web_image }}"
            --sfu-image "${{ steps.meta.outputs.sfu_image }}"
          )
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            pnpm release:build -- "${COMMON_ARGS[@]}" --skip-verify
          else
            pnpm release:build -- "${COMMON_ARGS[@]}"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.meta.outputs.app_version) || format('snapshot-main-{0}', steps.meta.outputs.short_sha) }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.meta.outputs.app_version) || format('Seclettr snapshot {0}', steps.meta.outputs.short_sha) }}
          body_path: /tmp/commit-body.txt
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          fail_on_unmatched_files: true

      - name: Upload artifact — bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.bundle_prefix }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
