packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@types/react": "18.3.28"
  "@types/react-dom": "18.3.7"
  "rollup": ">=4.59.0"
  "undici": ">=7.24.0"
  "fast-xml-parser": ">=5.5.6"
  "fast-xml-builder": "1.2.0"
  "@aws-sdk/core": "3.974.13"
  "flatted": ">=3.4.0"
  "minimatch": "9.0.7"
  "test-exclude@6.0.0>minimatch": "3.1.2"
  "minimatch@3.1.2>brace-expansion": "1.1.12"
  "brace-expansion": ">=5.0.9"
  "fast-jwt": "6.2.4"
  "fast-uri": ">=3.1.6"
  "find-my-way": ">=9.6.1"
  "form-data": ">=2.5.6"
  "websocket-driver": ">=0.7.5"
  "ws": ">=8.21.0"
  "tar": ">=7.5.21"
  "serialize-javascript": ">=7.0.3"

allowBuilds:
  "@capacitor/background-runner": true
  "@firebase/util": true
  argon2: true
  esbuild: true
  mediasoup: true
