# ─── Seclettr Docker Compose ──────────────────────────────────────────
#
# Services:
#   postgres  — PostgreSQL 16 (message store, device registry)
#   redis     — Redis 7 (pub/sub, rate limiting)
#   minio     — MinIO (S3-compatible, encrypted attachment storage)
#   coturn    — TURN server (NAT traversal for WebRTC)
#   api       — Fastify API server
#   sfu       — mediasoup SFU for group calls
#   web       — Nginx serving Vite-built SPA
#
# Usage:
#   cp infra/.env.example infra/.env   (edit secrets!)
#   docker compose -f infra/docker-compose.yml up
#
# NOTE: All secrets in .env.example are INSECURE defaults for local dev only.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Applied to the application containers (api/sfu/web). They run as non-root and
# need no Linux capabilities; drop them all and forbid privilege escalation
# (AUDIT.md infra).
x-hardening: &default-hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

# Memory ceilings on the stateless app containers; data services manage their
# own memory and are left unconstrained. Override via env if needed.
x-api-limits: &api-limits
  resources:
    limits:
      memory: ${API_MEMORY_LIMIT:-1g}
x-web-limits: &web-limits
  resources:
    limits:
      memory: ${WEB_MEMORY_LIMIT:-256m}
x-sfu-limits: &sfu-limits
  resources:
    limits:
      memory: ${SFU_MEMORY_LIMIT:-2g}

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seclettr
      POSTGRES_USER: seclettr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seclettr -d seclettr"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ── Redis ─────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────

  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23-debian-12-r5}
    restart: unless-stopped
    # The Bitnami-based image defaults to UID 1001, which cannot write the
    # root-owned named volume; pin root to match the previous upstream image.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── MinIO bucket creation (one-shot init container) ───────────────────────

  minio-init:
    image: ${MINIO_MC_IMAGE:-bitnamilegacy/minio-client:2025.7.21-debian-12-r3}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set} ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set} &&
        mc mb --ignore-existing local/seclettr-attachments &&
        mc anonymous set none local/seclettr-attachments
      "
    logging: *default-logging

  # ── coturn TURN server ────────────────────────────────────────────────────

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.18.0-r0-alpine}
    restart: unless-stopped
    network_mode: host  # required for TURN to work correctly with host IP
    command: >
      -n
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set}
      --realm=${TURN_DOMAIN:-localhost}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --min-port=${TURN_MIN_PORT:-50000}
      --max-port=${TURN_MAX_PORT:-51999}
      --log-file=stdout
      --fingerprint
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
    logging: *default-logging

  # ── API server ────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *default-hardening
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./migrations:/app/infra/migrations:ro
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      DATABASE_URL: postgresql://seclettr:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/seclettr
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_BUCKET: seclettr-attachments
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MAX_MESSAGE_JSON_BYTES: ${MAX_MESSAGE_JSON_BYTES:-12582912}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set}
      TURN_DOMAIN: ${TURN_DOMAIN:-localhost}
      # SFU uses host networking, so the API reaches it via the host gateway.
      SFU_URL: ${SFU_URL:-http://host.docker.internal:3002}
      SFU_PUBLIC_URL: ${SFU_PUBLIC_URL:-}
      DELIVERED_MESSAGE_RETENTION_DAYS: ${DELIVERED_MESSAGE_RETENTION_DAYS:-30}
      UNDELIVERED_MESSAGE_RETENTION_DAYS: ${UNDELIVERED_MESSAGE_RETENTION_DAYS:-90}
      GROUP_MESSAGE_RETENTION_DAYS: ${GROUP_MESSAGE_RETENTION_DAYS:-30}
      ENDED_CALL_SESSION_RETENTION_DAYS: ${ENDED_CALL_SESSION_RETENTION_DAYS:-30}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN must be set}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      APP_URL: ${APP_URL:-http://localhost:5173}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *api-limits
    logging: *default-logging

  # ── SFU (mediasoup) ───────────────────────────────────────────────────────

  sfu:
    build:
      context: ..
      dockerfile: apps/sfu/Dockerfile
    restart: unless-stopped
    <<: *default-hardening
    network_mode: host  # mediasoup needs host networking for RTP UDP
    environment:
      NODE_ENV: production
      SFU_PORT: 3002
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      API_INTERNAL_URL: http://127.0.0.1:${API_HOST_PORT:-3001}
      ANNOUNCED_IP: ${ANNOUNCED_IP:-127.0.0.1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *sfu-limits
    logging: *default-logging

  # ── Web (Nginx serving the Vite build) ────────────────────────────────────

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    <<: *default-hardening
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:80:8080"
      - "0.0.0.0:443:8443"
    volumes:
      - ./nginx/${NGINX_CONFIG:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    healthcheck:
      # Default NGINX_CONFIG=nginx.conf serves TLS on 8443 and 301-redirects 8080;
      # NGINX_CONFIG=nginx.http.conf serves plain HTTP on 8080. Probe both so the
      # same base compose works in either mode.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/runtime-config.js 2>/dev/null | grep -q '__SECLETTR_RUNTIME_CONFIG__' || wget -qO- http://127.0.0.1:8080/runtime-config.js 2>/dev/null | grep -q '__SECLETTR_RUNTIME_CONFIG__'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      <<: *web-limits
    logging: *default-logging

volumes:
  postgres_data:
  minio_data:
