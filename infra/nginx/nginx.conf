worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # Upstream services
  upstream api {
    server api:3001;
    keepalive 32;
  }

  upstream sfu {
    server host.docker.internal:3002;
    keepalive 16;
  }

  upstream minio {
    server minio:9000;
    keepalive 16;
  }

  # ─── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ─── Main HTTPS server ─────────────────────────────────────────────────────
  server {
    listen 8443 ssl;
    server_name _;
    http2 on;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static SPA ────────────────────────────────────────────────────────────
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }

    # Cache immutable assets (Vite adds content hash to filenames)
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      expires 1y;
    }

    # Service worker — must not be cached
    location /sw.js {
      include /etc/nginx/security-headers.conf;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Cache-Control "no-store" always;
    }

    # Runtime-config is mutable at deployment time and must not be cached.
    location = /runtime-config.js {
      include /etc/nginx/security-headers.conf;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header Cache-Control "no-store" always;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # MinIO presigned upload/download URLs are rewritten by the API to this
    # public origin. Keep the bucket path intact and pass the internal Host
    # header expected by MinIO/SigV4 validation.
    #
    # CORS: the Capacitor Android WebView runs on https://localhost so fetch()
    # calls to presigned URLs require explicit allow. Presigned URLs are
    # authenticated via SigV4 query params so broadening CORS here is safe.
    location ~ ^/(seclettr-attachments|seclettr-attachments-plain)(/|$) {
      # Handle CORS preflight without touching MinIO
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://localhost" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, X-Amz-Date, X-Amz-Content-Sha256" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, ETag" always;
        add_header Access-Control-Max-Age 3600 always;
        return 204;
      }
      add_header Access-Control-Allow-Origin "https://localhost" always;
      add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, ETag" always;
      # Object storage holds user-controlled bytes; prevent MIME sniffing so a
      # mislabeled upload cannot be interpreted as script on the app origin.
      include /etc/nginx/security-headers.conf;

      client_max_body_size 110m;
      proxy_pass http://minio;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Auth endpoints — stricter rate limit
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api/auth/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (signaling)
    location /ws {
      proxy_pass http://api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # SFU API
    location /sfu/ {
      proxy_pass http://sfu/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
